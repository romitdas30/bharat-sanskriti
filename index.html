<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Sanskriti - Cultural AI Assistant</title>
    <!-- Included Marked.js for parsing Markdown in responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        h1 {
            margin-top: 0;
            color: #111827;
            font-size: 1.75rem;
            text-align: center;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
            font-size: 0.95rem;
        }
        select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            background-color: #fff;
        }
        select:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        textarea {
            resize: vertical;
            height: 110px;
            line-height: 1.5;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        /* --- Response Box Styling --- */
        .response-box {
            margin-top: 28px;
            padding: 24px;
            border-radius: 10px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: none;
        }
        
        /* Status Badges */
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 16px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .badge-json {
            background-color: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }
        .badge-fallback {
            background-color: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        /* Formatted Response Content */
        .formatted-response {
            color: #1f2937;
            line-height: 1.7;
            font-size: 0.95rem;
        }
        .formatted-response h1, 
        .formatted-response h2, 
        .formatted-response h3 {
            color: #111827;
            margin-top: 1.2em;
            margin-bottom: 0.6em;
            font-weight: 600;
        }
        .formatted-response h3 {
            font-size: 1.1rem;
        }
        .formatted-response p {
            margin-top: 0;
            margin-bottom: 1em;
        }
        .formatted-response ul, 
        .formatted-response ol {
            margin-top: 0;
            margin-bottom: 1em;
            padding-left: 1.4rem;
        }
        .formatted-response li {
            margin-bottom: 0.4em;
        }
        .formatted-response strong {
            color: #111827;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bharat Sanskriti Assistant</h1>
    
    <div class="form-group">
        <label for="stateSelect">Select Indian State:</label>
        <select id="stateSelect">
            <option value="Rajasthan">Rajasthan</option>
            <option value="Kerala">Kerala</option>
            <option value="Assam">Assam</option>
        </select>
    </div>

    <div class="form-group">
        <label for="queryInput">Your Question:</label>
        <textarea id="queryInput" placeholder="Ask about culture, threats, or preservation strategies..."></textarea>
    </div>

    <button id="submitBtn" onclick="sendQuery()">Submit Request</button>

    <div id="responseContainer" class="response-box">
        <div id="statusBadge" class="badge"></div>
        <div id="outputContent" class="formatted-response"></div>
    </div>
</div>

<script>
    async function sendQuery() {
        const stateName = document.getElementById('stateSelect').value;
        const userQuery = document.getElementById('queryInput').value.trim();
        const btn = document.getElementById('submitBtn');
        const responseBox = document.getElementById('responseContainer');
        const badge = document.getElementById('statusBadge');
        const output = document.getElementById('outputContent');

        if (!userQuery) {
            alert("Please type a question first.");
            return;
        }

        // Loading State
        btn.disabled = true;
        btn.innerText = "Querying RAG Knowledge Base...";
        responseBox.style.display = "none";

        try {
            const response = await fetch('http://127.0.0.1:8000/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    state_name: stateName,
                    user_query: userQuery
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Server request failed");
            }

            // Set Data Source Badge
            if (data.found_in_json) {
                badge.className = "badge badge-json";
                badge.innerText = "Ground Truth: JSON Knowledge Base";
            } else {
                badge.className = "badge badge-fallback";
                badge.innerText = "Fallback: General Knowledge Base";
            }

            // Parse Markdown string into clean HTML using Marked.js
            output.innerHTML = marked.parse(data.ai_response);
            responseBox.style.display = "block";

        } catch (err) {
            alert("Error: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Submit Request";
        }
    }
</script>

</body>
</html>
